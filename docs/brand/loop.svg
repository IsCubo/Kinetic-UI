<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The kinetic-ui loop: Direction sets mode, world, and one focal moment; Build ships T0 first with reduced motion always on; Verify reports PASS, FAIL, or BLOCKED with evidence; Critique reports severity, findings, and one highest-leverage fix; Critique's fixes loop back into Build for a re-check.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b5bff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a93a6"/>
    </marker>
  </defs>

  <!-- connectors -->
  <line x1="200" y1="90" x2="248" y2="90" stroke="#3b5bff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="448" y1="90" x2="496" y2="90" stroke="#3b5bff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="696" y1="90" x2="744" y2="90" stroke="#3b5bff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- fix loop-back -->
  <path d="M820 140 C 820 215, 400 215, 372 148" fill="none" stroke="#8a93a6" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <text x="596" y="235" font-size="16" fill="#8a93a6" text-anchor="middle" letter-spacing="1">fix &amp; re-check</text>

  <!-- node 1: direction -->
  <g>
    <rect x="10" y="40" width="190" height="100" rx="14" fill="none" stroke="#3b5bff" stroke-width="2.5"/>
    <text x="105" y="80" font-size="24" font-weight="700" fill="#3b5bff" text-anchor="middle">Direction</text>
    <text x="105" y="106" font-size="14" fill="#8a93a6" text-anchor="middle">mode, world,</text>
    <text x="105" y="124" font-size="14" fill="#8a93a6" text-anchor="middle">one focal moment</text>
  </g>

  <!-- node 2: build -->
  <g>
    <rect x="248" y="40" width="200" height="100" rx="14" fill="#3b5bff"/>
    <text x="348" y="80" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Build</text>
    <text x="348" y="106" font-size="14" fill="#dbe2ff" text-anchor="middle">T0 first, tiers up,</text>
    <text x="348" y="124" font-size="14" fill="#dbe2ff" text-anchor="middle">reduced motion always</text>
  </g>

  <!-- node 3: verify -->
  <g>
    <rect x="496" y="40" width="200" height="100" rx="14" fill="none" stroke="#3b5bff" stroke-width="2.5"/>
    <text x="596" y="80" font-size="24" font-weight="700" fill="#3b5bff" text-anchor="middle">Verify</text>
    <text x="596" y="106" font-size="14" fill="#8a93a6" text-anchor="middle">PASS / FAIL / BLOCKED,</text>
    <text x="596" y="124" font-size="14" fill="#8a93a6" text-anchor="middle">evidence not claims</text>
  </g>

  <!-- node 4: critique -->
  <g>
    <rect x="744" y="40" width="200" height="100" rx="14" fill="none" stroke="#3b5bff" stroke-width="2.5"/>
    <text x="844" y="80" font-size="24" font-weight="700" fill="#3b5bff" text-anchor="middle">Critique</text>
    <text x="844" y="106" font-size="14" fill="#8a93a6" text-anchor="middle">severity, findings,</text>
    <text x="844" y="124" font-size="14" fill="#8a93a6" text-anchor="middle">one highest-leverage fix</text>
  </g>
</svg>
